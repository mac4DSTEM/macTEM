# PROVENANCE: mac4DSTEM df1e6c994ea5b49c7ec08737628631b204736974 .github/workflows/ci.yml adapted
# mac4DSTEM's core and inventory jobs on its runner image; its paused unit job kept paused; no scientific job yet.
# END PROVENANCE
#
# CI — what a public checkout can reproduce, on every push and pull request.
#
# WHAT RUNS:
#   * `tools/run-tests.sh core`      — TEMCore and TEMSession built standalone by `swift build` (Package.swift)
#     from a fresh scratch path: the layering gate. It fails the moment Core reaches into Session or either
#     reaches into the app, and on any compiler warning.
#   * `tools/run-tests.sh inventory` — the repo's own review. Its checks are listed in tools/run-tests.sh, not
#     here, so this comment cannot go stale. It needs neither the mac4DSTEM checkout nor the reference venv: its
#     copy check is `tools/check-shared-drift.sh --static` (headers, pin, copy list). Comparing the copies' bodies
#     with mac4DSTEM needs that checkout, so it runs on the dev Mac (tools/hooks/pre-push), not here.
#
# PAUSED from day one: `unit`, the XCTest suite. The app targets macOS 27 and no GitHub runner image can build a
# macOS 27 app; mac4DSTEM paused its unit job for the same reason (its ADR 040, "Four owed decisions settled",
# decision 4). The job stays below with `if: false` and comes back, as the independent gate a one-machine setup
# lacks, once GitHub offers a macOS 27 image. Until then `unit` runs locally (`tools/run-tests.sh unit`).
#
# NOT RUN YET: `scientific`. Its reference stack is a venv that tools/lib/python.sh builds on CPython 3.14 from
# tools/lib/references-lock.txt (the full closure, as wheels), and the harnesses fetch further pinned sources
# into the gitignored References/. No job sets that up yet, so every parity number is a local, dated run.
#
# EXCLUDED: on-screen verification. The app is driven by hand; no runner can stand in for it.
#
# KNOWN CAVEATS, so a green run is not made to claim too much:
#   * `core` builds with the image's default Xcode 26 and its macOS 26 SDK although Package.swift declares
#     .macOS("27.0"), exactly as mac4DSTEM's core job does (green there on 2026-10-08: Xcode 26.6, Swift 6.3.3).
#     The dev Mac builds with Xcode 27. A source that uses an API only in the macOS 27 SDK, or a Swift 6 language
#     mode diagnostic (now including a warning) only one of the two compilers emits, will part the two results;
#     that is the runner's limit, stated here, not a flake.
#   * The timeouts are margin, not measurement; nothing has timed these jobs off the dev Mac yet.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch/PR runs cancel; main runs always complete: on main each commit's finished run is the record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: unit (XCTest)
    # PAUSED (mac4DSTEM ADR 040): no runner image can build a macOS 27 app, so this job could only ever be red.
    # To resume: delete this `if` and set `runs-on` to the first macOS 27 image.
    if: false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Ensure the Metal toolchain component
        # Xcode 26 ships the Metal compiler as a separate download; the app compiles macTEM/Shaders/*.metal.
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Run the unit gate
        run: tools/run-tests.sh unit

  inventory:
    name: inventory (repo review)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # mac4DSTEM's inventory reads HEAD^ on a clean tree, which the default depth of 1 does not have; its
          # job could never pass until this was set (mac4DSTEM, 2026-09-09). Kept so a rule that compares
          # against the previous commit does not repeat that.
          fetch-depth: 2
      - name: Run the inventory
        run: tools/run-tests.sh inventory

  core:
    name: core (TEMCore + TEMSession package build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Build the package layers standalone
        run: tools/run-tests.sh core

  kit-boundary:
    name: kit boundary (no numerics frameworks in the app)
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail on Accelerate / Metal / vDSP outside the allowlist
        # Decision D15. Plain grep, no build; also part of `inventory`, kept as its own job so the red is named.
        run: tools/check-kit-boundary.sh
