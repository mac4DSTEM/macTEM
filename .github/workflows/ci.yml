# Adapted from mac4DSTEM (.github/workflows/ci.yml).
#
# CI — what a public checkout can reproduce, on every push and pull request. Every job here runs on GitHub's own
# runners (macos-26 or ubuntu-latest), never on the org's Mac, so no PR waits on that Mac being awake (SEM program,
# 2026-11-06; docs/decisions.md). The Mac runner keeps only what needs a screen: the UI journeys and their screenshots
# (.github/workflows/ui.yml, nightly and by hand, queued while the Mac is offline).
#
# WHAT RUNS:
#   * `tools/run-tests.sh unit`      — the XCTest suite (macTEMTests) through xcodebuild, every declared test run by name.
#   * `tools/run-tests.sh core`      — TEMCore and TEMSession built standalone by `swift build` (Package.swift)
#     from a fresh scratch path: the layering gate. It fails the moment Core reaches into Session or either
#     reaches into the app, and on any compiler warning.
#   * `tools/run-tests.sh inventory` — the repo's own review. Its checks are listed in tools/run-tests.sh, not
#     here, so this comment cannot go stale. It needs no sibling checkout and no reference venv.
#
# XCODE: every macOS job uses Xcode 26.6 (DEVELOPER_DIR below), never the image's default, so an image update cannot
# change the toolchain on an unchanged tree.
#
# KITS: Package.swift takes the kits and MacEMUI by version range from github.com/mac4DSTEM (public repos, no token);
# Package.resolved pins the exact versions. The SwiftPM repository cache is restored per Package.resolved so the clones
# are not fetched again on an unchanged pin set; the builds themselves start from scratch (the warnings gate needs that).
#
# NOT RUN YET: `scientific`. Its reference stack is a venv that tools/lib/python.sh builds on CPython 3.14 from
# tools/lib/references-lock.txt (the full closure, as wheels), and the harnesses fetch further pinned sources
# into the gitignored References/. No job sets that up yet, so every parity number is a local, dated run.
#
# EXCLUDED: on-screen verification by a person. The UI journeys run on the Mac (ui.yml); Paul's own drive of a build
# is what ships a room.
#
# KNOWN CAVEATS, so a green run is not made to claim too much:
#   * CI builds with Xcode 26.6 and its macOS 26 SDK; the dev Mac builds with Xcode 27. A source that uses an API only in the macOS 27 SDK, or a Swift 6 language
#     mode diagnostic (now including a warning) only one of the two compilers emits, will part the two results;
#     that is the runner's limit, stated here, not a flake.
#   * Measured 2026-11-06 on macos-26: unit 8-10 min, core about 3 min, inventory under 1 min. The timeouts are margin.

name: CI

on:
  # main and tags only: a PR branch's pushes run once, through pull_request (macEM-suite#77).
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch/PR runs cancel; main runs always complete: on main each commit's finished run is the record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  unit:
    name: unit (XCTest)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Restore the SwiftPM repository cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Ensure the Metal toolchain component
        # Xcode 26 ships the Metal compiler as a separate download; the app compiles macTEM/Shaders/*.metal.
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Run the unit gate
        run: tools/run-tests.sh unit

  inventory:
    name: inventory (repo review)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # mac4DSTEM's inventory reads HEAD^ on a clean tree, which the default depth of 1 does not have; its
          # job could never pass until this was set (mac4DSTEM, 2026-09-09). Kept so a rule that compares
          # against the previous commit does not repeat that.
          fetch-depth: 2
      - name: Restore the SwiftPM repository cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Resolve the pinned MacEMUI
        # The UI-journey identifier check reads the shell's sources from .build/checkouts/MacEMUI (no ../MacEMUI here).
        run: swift package resolve
      - name: Run the inventory
        run: tools/run-tests.sh inventory

  core:
    name: core (TEMCore + TEMSession package build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Restore the SwiftPM repository cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Build the package layers standalone
        run: tools/run-tests.sh core

  kit-boundary:
    name: kit boundary (no numerics frameworks in the app)
    # Plain bash, grep and awk: Linux runs it (checked with mawk), off the macOS runner queue.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on Accelerate / Metal / vDSP outside the allowlist
        # Decision D15. Plain grep, no build; also part of `inventory`, kept as its own job so the red is named.
        run: tools/check-kit-boundary.sh

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
