# Unused-code scan (Periphery). The suite template, adapted for an app: Periphery builds the Xcode project's
# macTEM scheme itself (the app, its package layers and its tests), so the app target is scanned too, not only Package.swift.
# No --retain-public: an app has no outside consumers.
# Weekly: keeps one open issue, "Periphery weekly scan", up to date with the findings. Findings are for triage; nothing is
# deleted here.
# On a pull request that touches Swift: the same scan without the findings .periphery-baseline.json records (triaged and
# kept) and without Codable properties. A finding that is left is new: it is annotated on the PR and the job fails (since
# macEM#332; a warning only before). GitHub keeps only 10 annotations per step and its log shows the warnings without
# their files, so the job also lists every new finding with its file, line and column: as a table in the job summary
# (capped at 400 rows), as plain lines in the log of the step "List every new finding", and in the raw scan output,
# uploaded as the artifact periphery-findings-<run>. Delete the code or, for a false positive, write the baseline again in the same PR:
#   periphery scan --project macTEM.xcodeproj --schemes macTEM --retain-codable-properties \
#     --write-baseline .periphery-baseline.json -- CODE_SIGNING_ALLOWED=NO
# Without a Mac: run this workflow by hand on the PR's branch with `write_baseline` ticked, from the Actions page or with
#   gh workflow run periphery.yml --ref <branch> -f write_baseline=true
# That run does the scan above on GitHub's runner, uploads the file it wrote as the artifact periphery-baseline-<run> and
# leaves the weekly issue alone; download the artifact and commit the file in the PR. It records every finding of that
# tree as kept, so triage first: what should go is deleted before the baseline is written, not after.
# BREW: Homebrew has deprecated the periphery formula and disables it on 2027-08-12. Until then `brew install periphery`
# still installs it and prints the notice; before that date the install steps below need another source.
name: Periphery

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      write_baseline:
        description: "Write .periphery-baseline.json afresh and upload it as an artifact (no issue update)"
        type: boolean
        required: false
        default: false
  pull_request:
    paths: ["**.swift", ".periphery-baseline.json", ".github/workflows/periphery.yml"]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    # The weekly run and a plain run by hand; a run by hand that writes the baseline does only that (the job below).
    if: github.event_name != 'pull_request' && !inputs.write_baseline
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Install Periphery
        run: brew install periphery && periphery version
      - name: Build and scan the Xcode project
        run: |
          periphery scan --project macTEM.xcodeproj --schemes macTEM --format csv --relative-results \
            -- CODE_SIGNING_ALLOWED=NO > periphery.csv
          echo "count=$(( $(wc -l < periphery.csv) - 1 ))" >> "$GITHUB_ENV"
      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Periphery weekly scan"
          echo "Periphery $(periphery version), commit ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d): **${count} findings** (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." > body.md
          printf '\n| Kind | Name | Location | Hint |\n|---|---|---|---|\n' >> body.md
          python3 - >> body.md <<'PY'
          import csv
          for r in list(csv.DictReader(open('periphery.csv')))[:100]:
              print(f"| {r['Kind']} | `{r['Name']}` | {r['Location']} | {r['Hints']} |")
          PY
          [ "$count" -le 100 ] || echo "| … | $((count - 100)) more in the run's log | | |" >> body.md
          cat periphery.csv
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi

  new-findings:
    name: New unused code
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Install Periphery
        run: brew install periphery && periphery version
      - name: Build and scan against the baseline
        run: |
          periphery scan --project macTEM.xcodeproj --schemes macTEM --retain-codable-properties \
            --baseline .periphery-baseline.json --format github-actions --relative-results \
            -- CODE_SIGNING_ALLOWED=NO | tee periphery.txt
          count=$(grep -c '^::warning' periphery.txt || true)
          echo "Periphery: ${count} new finding(s) against .periphery-baseline.json" >> "$GITHUB_STEP_SUMMARY"
      - name: List every new finding
        # The scan step's ::warning lines are the findings. Each one goes to this step's log as a plain line (one that does
        # not start with "::", so it stays text) and to the job summary as a table row, both with its file, line and column.
        # Never fails here: the step "Fail on a new finding" below does, after the upload.
        run: |
          python3 -I - periphery.txt <<'PY'
          import os
          import re
          import sys

          # Periphery's github-actions format, one finding per line:
          #   ::warning file=<path>,line=<line>,col=<column>,title=<hint>::<message>
          # Periphery 3.8 escapes nothing, but GitHub's workflow-command escapes are undone all the same, in one pass so
          # that "%253A" becomes "%3A" and not ":". Color codes are dropped; a missing property leaves its cell empty.
          MAX_ROWS = 400
          MAX_BYTES = 256_000
          MAX_CELL = 300
          ESCAPES = {"%25": "%", "%0D": "\r", "%0A": "\n", "%3A": ":", "%2C": ","}
          ESCAPE = re.compile(r"%(?:25|0D|0A|3A|2C)", re.IGNORECASE)
          ANSI = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          # A property starts at a comma followed by a known key, so an unescaped comma inside a value does not split it.
          PROPERTY = re.compile(r",(?=\s*(?:file|line|endLine|col|endColumn|title)=)")

          def unescape(text):
              return ESCAPE.sub(lambda m: ESCAPES[m.group(0).upper()], text)

          def one_line(text):
              return " ".join(text.split())

          def parse(line):
              rest = line[len("::warning"):]
              head, sep, message = rest.partition("::")
              if not sep:
                  head, message = "", rest
              props = {}
              for part in PROPERTY.split(head.strip()):
                  key, eq, value = part.partition("=")
                  if eq and key.strip():
                      props[key.strip()] = one_line(unescape(value))
              return props, one_line(unescape(message))

          def location(props):
              parts = [props.get("file") or "(no file)"]
              for key in ("line", "col"):
                  if not props.get(key):
                      break
                  parts.append(props[key])
              return ":".join(parts)

          def cell(text):
              if len(text) > MAX_CELL:
                  text = text[:MAX_CELL - 3] + "..."
              text = text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              return re.sub(r"([\\`*_\[\]|])", r"\\\1", text)

          sys.stdout.reconfigure(errors="replace")
          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8", errors="replace") as handle:
                  raw = handle.read().splitlines()
          except OSError as error:
              print(f"Periphery: no scan output to list ({error})")
              sys.exit(0)
          findings = []
          for line in raw:
              # The same lines the scan step counts and GitHub annotates.
              if line.startswith("::warning"):
                  findings.append(parse(ANSI.sub("", line)))

          print(f"Periphery: {len(findings)} new finding(s), as location, hint and message:")
          for number, (props, message) in enumerate(findings, 1):
              print(f"{number:4d}. {location(props)}  {props.get('title', '')}  {message}")
          if not findings:
              sys.exit(0)

          rows = ["", "| # | Location | Hint | Message |", "|---:|---|---|---|"]
          size = sum(len(row.encode()) + 1 for row in rows)
          shown = 0
          for number, (props, message) in enumerate(findings, 1):
              row = f"| {number} | {cell(location(props))} | {cell(props.get('title', ''))} | {cell(message)} |"
              if shown == MAX_ROWS or size + len(row.encode()) + 1 > MAX_BYTES:
                  break
              rows.append(row)
              size += len(row.encode()) + 1
              shown += 1
          if shown < len(findings):
              artifact = "periphery-findings-" + os.environ.get("GITHUB_RUN_NUMBER", "<run>")
              rows += ["", f"{len(findings) - shown} more finding(s) are left out of this table; the log of the step "
                           f"\"List every new finding\" and the artifact {artifact} have them all."]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              try:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(rows) + "\n")
              except OSError as error:
                  print(f"Periphery: could not write the job summary ({error})")
          PY
      - name: Upload the scan output
        # The raw scan output, ::warning lines and all, for a closer look or a script.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periphery-findings-${{ github.run_number }}
          path: periphery.txt
          if-no-files-found: warn
          retention-days: 14
          # A re-run of the job uploads under the same name.
          overwrite: true
      - name: Fail on a new finding
        # The baseline holds every triaged finding (macEM#332, 2026-11-13), so a finding left is new: delete the code, or for a
        # false positive write the baseline again in the same PR (the header says how, with or without a Mac).
        run: |
          count=$(grep -c '^::warning' periphery.txt || true)
          if [ "$count" -gt 0 ]; then
            echo "Periphery: ${count} new finding(s); the step \"List every new finding\" names each" >&2
            exit 1
          fi

  baseline:
    name: Write the baseline (artifact)
    # By hand only, with the input ticked: the pull-request scan's flags with --write-baseline in place of --baseline, so
    # the file holds exactly what that scan would otherwise report. Nothing is committed from here: the token is read-only.
    if: github.event_name == 'workflow_dispatch' && inputs.write_baseline
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Install Periphery
        run: brew install periphery && periphery version
      - name: Build, scan and write the baseline
        run: |
          periphery scan --project macTEM.xcodeproj --schemes macTEM --retain-codable-properties \
            --write-baseline .periphery-baseline.json --relative-results \
            -- CODE_SIGNING_ALLOWED=NO
          # How the written file differs from the committed one, for the log; the count is for the summary and never fails the step.
          git diff --stat -- .periphery-baseline.json
          # The file itself, between markers, for a session that cannot download artifacts (a cloud session's proxy refuses
          # the artifact store): copy the line between the markers into .periphery-baseline.json.
          echo "----- .periphery-baseline.json -----"
          python3 -c 'import json; print(json.dumps(json.load(open(".periphery-baseline.json")), separators=(",", ":")))'
          echo "----- end -----"
          entries=$(python3 -c 'import json; print(len(json.load(open(".periphery-baseline.json"))["v1"]["usrs"]))' || echo "?")
          echo "Periphery: baseline written with ${entries} entries at ${GITHUB_SHA::7}; the artifact periphery-baseline-${GITHUB_RUN_NUMBER} holds the file to commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the baseline
        uses: actions/upload-artifact@v7
        with:
          name: periphery-baseline-${{ github.run_number }}
          path: .periphery-baseline.json
          # The file's name starts with a dot, and upload-artifact leaves such files out unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
