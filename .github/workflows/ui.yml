# UI journeys on the org's Mac: the one job that needs a screen. Everything a PR waits on runs on GitHub's runners
# (ci.yml); this workflow is never a required check and never runs on a pull request, so an offline Mac holds no PR
# (SEM program, 2026-11-06; docs/decisions.md).
#
# WHAT RUNS: `tools/run-tests.sh ui` — the XCUITest journeys (macTEMUITests, scheme macTEMUI): the real app, signed,
# walked as a user would, one screenshot per step. The screenshots and the result bundle are uploaded as artifacts of
# the run; this is the on-screen record a review reads, and the source of a room PR's release-assets shots.
#
# WHEN: by hand only (docs/decisions.md, 2026-11-10): the journeys drive the screen and must not run under a person's
# hands, and the Mac is in use at any hour. A run takes an optional list of journeys. The job targets the Mac by label,
# with no fallback to a GitHub runner: while the Mac is offline the job queues, and runs when the Mac is back (GitHub
# drops a job no runner has taken within 24 hours).
#
# XCODE: the Mac's selected Xcode (xcode-select), the one the app is driven and released with, not ci.yml's pinned
# 26.6: the UI runner app at ~/Library/Caches/macEM-ui-tests/macTEM holds its Screen Recording and Accessibility grants
# by path, and that path is built by the Mac's own toolchain.
name: UI journeys

on:
  # By hand only (decided 2026-11-10, docs/decisions.md): the journeys drive the Mac's screen, which is in use at any hour.
  workflow_dispatch:
    inputs:
      journeys:
        description: "Journey classes to run, space-separated (empty: all but PerformanceJourney)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ui-journeys
  # One screen: a second run waits for the first instead of fighting it for the window.
  cancel-in-progress: false

jobs:
  journeys:
    name: UI journeys (Mac runner, screenshots)
    # The org variable MACEM_MAC_RUNNER names the Mac's labels; its fixed labels are the fallback, never a GitHub runner.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && fromJSON(vars.MACEM_MAC_RUNNER) || fromJSON('["self-hosted","macOS","macem-mac"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The gate's output (logs, result bundle, screenshots) in the run's own temp folder, so the upload steps know the
      # path. Set here because a job-level env cannot read the runner context: with it there, GitHub refused the whole
      # file, and every push since 2026-11-06 showed this workflow as a failed run that never started.
      - name: Gate folder
        run: echo "MACTEM_GATE_DIR=$RUNNER_TEMP/gate" >> "$GITHUB_ENV"
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Run the UI journeys
        # The dispatch input reaches the shell as data in JOURNEYS, never as script text, and only as names: letters, digits,
        # `_` and `/` (Class or Class/testMethod), separated by spaces; anything else is refused before xcodebuild runs. A dispatch
        # without names runs all but PerformanceJourney.
        shell: bash
        env:
          JOURNEYS: ${{ inputs.journeys }}
        run: |
          names='^[A-Za-z0-9_/ ]*$'
          if [[ ! "$JOURNEYS" =~ $names ]]; then
            echo "ui.yml: journeys must be class names separated by spaces; refused: $JOURNEYS" >&2
            exit 64
          fi
          # Unquoted on purpose: one argument per name.
          tools/run-tests.sh ui $JOURNEYS
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ github.run_number }}
          path: ${{ runner.temp }}/gate/ui-screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the result bundle and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-xcresult-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/gate/ui.xcresult
            ${{ runner.temp }}/gate/ui.log
          if-no-files-found: warn
          retention-days: 14
