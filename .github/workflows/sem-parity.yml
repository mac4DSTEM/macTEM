# SEM parity references — the drift gate of tools/parity/sem on a Linux runner, off the macOS queue.
#
# The committed bundles under tools/parity/sem/references are what the pinned Python stack (requirements.lock: kikuchipy,
# orix, diffsims, HyperSpy, exspy, RosettaSciIO, pyEBSDindex on CPython 3.14) emits for the committed fixtures and the
# fetched datasets. This job rebuilds that stack, fetches the data (raw.githubusercontent.com; Zenodo items are
# "manual" and no milestone-1 case needs one), emits every bundle afresh and compares within the committed tolerances
# (tools/parity/sem/check.py; an array of rotations whose manifest entry names a point group by its misorientation
# angle, tools/parity/sem/lib/refbundle_selftest.py checks that comparison first). Red means a reference moved: a stack
# pin, a fixture, or emit.py changed, and the bundle must be regenerated on purpose (`emit.py --out references`) and
# committed with the reason.
#
# The Swift side is the macTEMTests that call SEMParityReference.load, in the unit job of ci.yml. A test that compares
# a bundle runs on every pull request when the bundle's input is a committed fixture or the shipped demo scan, and only
# nightly and on dispatch when fetch-data.sh downloads its input (ci.yml's NIGHTLY paragraph says which run then).
# Those tests hold the ports to the bundles a test compares; this job holds every committed bundle to the stack, on the
# pull requests and pushes to main that touch tools/parity/sem or this file, and on dispatch. Both red on drift;
# neither per session on a Mac.

name: SEM parity references

on:
  push:
    branches: [main]
    paths:
      - 'tools/parity/sem/**'
      - '.github/workflows/sem-parity.yml'
  pull_request:
    paths:
      - 'tools/parity/sem/**'
      - '.github/workflows/sem-parity.yml'
  workflow_dispatch:

# Read-only token: the job reads the checkout and the caches and writes nothing back.
permissions:
  contents: read

concurrency:
  group: sem-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  references:
    name: references reproduce from the pinned stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/parity/sem/requirements.lock
      - name: Cache the fetched datasets
        uses: actions/cache@v5
        with:
          path: References/sem-data
          key: sem-data-${{ hashFiles('tools/parity/sem/data-manifest.txt') }}
      - name: Provision the pinned stack
        run: tools/parity/sem/setup.sh
      - name: The drift gate's comparison holds on its own
        run: References/sem-venv/bin/python -I -B tools/parity/sem/lib/refbundle_selftest.py
      - name: Fetch the datasets
        run: tools/parity/sem/fetch-data.sh
      - name: Fixtures are their checksums
        working-directory: tools/parity/sem/fixtures
        run: sha256sum -c SHA256SUMS
      - name: Planted fixtures regenerate unchanged
        run: |
          References/sem-venv/bin/python -I -B tools/parity/sem/make_fixtures.py
          git diff --exit-code --stat -- tools/parity/sem/fixtures
      # OpenBLAS picks its kernel per CPU at run time, and the runners differ: a bundle whose inputs went through BLAS
      # moved in its last bits from one runner to the next (#434). The planted comparison is emitted again under the
      # Haswell kernel, which every x86-64 runner can run, and compared with the committed bundle within its tolerances
      # (its inputs exact), whatever kernel the runner would pick itself; the next step runs every bundle on that one.
      - name: The planted comparison is the same under another BLAS kernel
        env:
          OPENBLAS_CORETYPE: Haswell
        run: |
          out="$RUNNER_TEMP/planted-haswell"
          References/sem-venv/bin/python -I -B tools/parity/sem/emit.py --out "$out" --only m4/indexing-compare-planted
          References/sem-venv/bin/python -I -B tools/parity/sem/lib/refbundle.py \
            tools/parity/sem/references/m4/indexing-compare-planted "$out/m4/indexing-compare-planted"
      - name: Emit and compare every bundle
        run: References/sem-venv/bin/python -I -B tools/parity/sem/check.py --require-data
