version: 2
updates:
  # GitHub Actions only, monthly, one grouped PR; it merges itself when CI is green (dependabot-auto-merge.yml).
  # Swift packages stay out: a kit update is a package update with its own PR and tests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
